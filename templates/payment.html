<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SkillKart Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f4f7fb;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }

      .title {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
      }

      .pay-btn {
        width: 100%;
        padding: 14px;
        border: none;
        background: #3399cc;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      .pay-btn:hover {
        background: #267aa3;
      }

      .success-box {
        display: none;
        margin-top: 25px;
        padding: 20px;
        background: #e8fff1;
        border: 1px solid #8ee0af;
        border-radius: 10px;
        text-align: center;
      }

      .success-box h2 {
        color: green;
        margin-bottom: 10px;
      }

      .success-box p {
        margin: 8px 0;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="title">SkillKart Payment</h1>

      <div class="input-group">
        <label>Enter JWT Token</label>
        <input type="text" id="token" />
      </div>

      <div class="input-group">
        <label>Enter Product ID</label>
        <input type="text" id="productId" />
      </div>

      <button class="pay-btn" onclick="payNow()">Pay Now</button>

      <div class="success-box" id="successBox">
        <h2>Payment Successful 🎉</h2>

        <p id="userName"></p>

        <p id="courseName"></p>

        <p>Thank you for purchasing from SkillKart.</p>
      </div>
    </div>

    <script>
      async function payNow() {
        try {
          const token = document.getElementById("token").value;

          const productId = document.getElementById("productId").value;

          console.log("TOKEN:", token);
          console.log("PRODUCT ID:", productId);

          const orderResponse = await fetch("/create-order", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },

            body: JSON.stringify({
              product_id: productId,
            }),
          });

          console.log("STATUS:", orderResponse.status);

          const orderData = await orderResponse.json();

          console.log("ORDER DATA:", orderData);

          var options = {
            key: orderData.key,

            amount: orderData.amount,

            currency: "INR",

            name: "SkillKart",

            description: orderData.product_name,

            order_id: orderData.razorpay_order_id,

            handler: async function (response) {
              const verifyResponse = await fetch("/verify-payment", {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },

                body: JSON.stringify({
                  product_id: productId,

                  razorpay_payment_id: response.razorpay_payment_id,

                  razorpay_order_id: response.razorpay_order_id,
                }),
              });

              const verifyData = await verifyResponse.json();

              console.log("VERIFY DATA:", verifyData);

              const profileResponse = await fetch("/profile", {
                method: "GET",

                headers: {
                  Authorization: `Bearer ${token}`,
                },
              });

              const profileData = await profileResponse.json();

              document.querySelector(".container").innerHTML = `

              <div style="
                  text-align:center;
                  padding:30px;
              ">

                  <div style="
                      width:90px;
                      height:90px;
                      background:#d4ffe2;
                      border-radius:50%;
                      margin:auto;
                      display:flex;
                      justify-content:center;
                      align-items:center;
                      font-size:40px;
                      color:green;
                  ">
                      ✓
                  </div>

                  <h1 style="
                      margin-top:20px;
                      color:#222;
                  ">
                      Payment Successful
                  </h1>

                  <p style="
                      margin-top:10px;
                      color:#666;
                      font-size:16px;
                  ">
                      Thank you for purchasing from SkillKart
                  </p>

                  <div style="
                      margin-top:30px;
                      background:#f5f7fb;
                      padding:20px;
                      border-radius:12px;
                      text-align:left;
                  ">

                      <h3 style="
                          margin-bottom:15px;
                          color:#333;
                      ">
                          Purchase Details
                      </h3>

                      <p style="margin:10px 0;">
                          <strong>Name:</strong> ${profileData.name}
                      </p>

                      <p style="margin:10px 0;">
                          <strong>Email:</strong> ${profileData.email}
                      </p>

                      <p style="margin:10px 0;">
                          <strong>Course:</strong> ${orderData.product_name}
                      </p>

                      <p style="margin:10px 0;">
                          <strong>Amount Paid:</strong> ₹${orderData.amount / 100}
                      </p>

                      <p style="margin:10px 0;">
                          <strong>Payment ID:</strong>
                          ${response.razorpay_payment_id}
                      </p>

                  </div>

              </div>

          `;
            },
          };

          console.log("OPENING RAZORPAY");

          var rzp1 = new Razorpay(options);

          rzp1.open();
        } catch (error) {
          console.log("ERROR:", error);

          alert("Something went wrong");
        }
      }
    </script>
  </body>
</html>
