<!doctype html>
<html>
  <head>
    <title>SkillKart Location</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
      body {
        margin: 0;
        font-family: Arial;
      }

      h1 {
        text-align: center;
        padding: 15px;
      }

      #map {
        height: 500px;
        width: 90%;
        margin: auto;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <h1>SkillKart Training Center</h1>

    <div id="map"></div>

    <script>
      var map = L.map("map").setView(
        [16.5062, 80.648], // Vijayawada
        13,
      );


      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
      }).addTo(map);


      L.marker([16.5062, 80.648])
        .addTo(map)
        .bindPopup(
          `
                <b>SkillKart Training Center</b>
                <br>
                Vijayawada
            `,
        )
        .openPopup();
    </script>
  </body>
</html>
